# Rosé Pine dark chrome for tmux.
# Pane dimming uses a paired foreground/background so inactive text stays legible.
# Keep inactive pane text high-contrast before tmux applies the dim attribute.

set -g @rose_pine_variant "dark"
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left "#[fg=#9ccfd8,bold]#S #[fg=#6e6a86]| #[default]#(whoami)@#H"
set -g status-right "#[fg=#6e6a86]%Y-%m-%d #[fg=#c4a7e7,bold]%H:%M "
setw -g window-status-current-format "#[fg=#191724,bg=#ebbcba,bold] #I:#W "
setw -g window-status-format "#[fg=#908caa] #I:#W "

source-file ~/.config/tmux/themes/pane-visibility-dark.conf
