# Rosé Pine Dawn chrome for tmux.
# Intended for daytime/light terminal backgrounds while preserving pane focus.
# Keep inactive pane text high-contrast before tmux applies the dim attribute.

set -g @rose_pine_variant "dawn"
set -g status-style "bg=#faf4ed,fg=#575279"
set -g status-left "#[fg=#286983,bold]#S #[fg=#9893a5]| #[default]#(whoami)@#H"
set -g status-right "#[fg=#9893a5]%Y-%m-%d #[fg=#907aa9,bold]%H:%M "
setw -g window-status-current-format "#[fg=#faf4ed,bg=#286983,bold] #I:#W "
setw -g window-status-format "#[fg=#797593] #I:#W "

source-file ~/.config/tmux/themes/pane-visibility-dawn.conf
