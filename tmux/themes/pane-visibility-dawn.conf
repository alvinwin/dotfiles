# Pane visibility overlay for Rosé Pine Dawn.

setw -g window-style "dim,fg=#575279,bg=#f2e9e1"
setw -g window-active-style "fg=default,bg=default"
setw -g pane-border-style "fg=#cecacd"
setw -g pane-active-border-style "fg=#286983,bold"
setw -g pane-border-status top
setw -g pane-border-lines single
setw -g pane-border-indicators colour
setw -g pane-border-format "#{?pane_active,#[fg=#faf4ed,bg=#286983,bold]#{p240: active p#P #{pane_current_command} }#[default],}"

set -g message-style "bg=#286983,fg=#faf4ed,bold"
setw -g mode-style "bg=#907aa9,fg=#faf4ed,bold"
set -g display-panes-colour "#9893a5"
set -g display-panes-active-colour "#286983"
