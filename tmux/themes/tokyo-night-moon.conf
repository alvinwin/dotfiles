# Quiet Tokyo Night Moon chrome for tmux.

set -g @terminal_theme_variant "tokyo-night-moon"
set -g status-style "bg=#222436,fg=#828bb8"
set -g status-left "#[fg=#828bb8] #S  "
set -g status-right "#[fg=#636da6] %H:%M "
setw -g window-status-format "#[fg=#636da6] #I #W  "
setw -g window-status-current-format "#[fg=#c8d3f5] #I #W  "
setw -g window-status-style "fg=#636da6,bg=#222436"
setw -g window-status-current-style "fg=#c8d3f5,bg=#222436"

setw -g window-style "fg=#828bb8,bg=#222436"
setw -g window-active-style "fg=default,bg=default"
setw -g pane-border-status off
setw -g pane-border-lines single
setw -g pane-border-style "fg=#2f334d"
setw -g pane-active-border-style "fg=#444a73"

set -g message-style "bg=#2f334d,fg=#c8d3f5"
setw -g mode-style "bg=#2f334d,fg=#c8d3f5"
set -g display-panes-colour "#636da6"
set -g display-panes-active-colour "#828bb8"
