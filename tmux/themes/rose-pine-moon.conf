# Static Rosé Pine Moon theme for tmux.

set -g @rose_pine_variant "moon"
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left "#[fg=#9ccfd8,bold]#S #[fg=#6e6a86]| #[default]#(whoami)@#H"
set -g status-right "#[fg=#6e6a86]%Y-%m-%d #[fg=#c4a7e7,bold]%H:%M "
setw -g window-status-current-format "#[fg=#232136,bg=#ea9a97,bold] #I:#W "
setw -g window-status-format "#[fg=#908caa] #I:#W "

set -g @thumbs-bg-color "#2a273f"
set -g @thumbs-fg-color "#e0def4"
set -g @thumbs-hint-bg-color "#f6c177"
set -g @thumbs-hint-fg-color "#232136"
set -g @thumbs-select-bg-color "#c4a7e7"
set -g @thumbs-select-fg-color "#232136"
set -g @thumbs-multi-bg-color "#eb6f92"
set -g @thumbs-multi-fg-color "#232136"
set -g @thumbs-contrast 1

# Moon pane visibility settings.

setw -g window-style "fg=default,bg=default"
setw -g window-active-style "fg=default,bg=default"
setw -g pane-border-style "fg=#44415a"
setw -g pane-active-border-style "fg=#f6c177,bold"
setw -g pane-border-status top
setw -g pane-border-lines single
setw -g pane-border-indicators colour
setw -g pane-border-format "#{?pane_active,#[fg=#232136#,bg=#f6c177#,bold] active p#P #{pane_current_command} #[default],}"

set -g message-style "bg=#f6c177,fg=#232136,bold"
setw -g mode-style "bg=#c4a7e7,fg=#232136,bold"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#f6c177"
