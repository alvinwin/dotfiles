# Plain fallback chrome for tmux.
# Use when the themed profiles get in the way.

set -g @rose_pine_variant "plain"
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour81,bold]#S #[fg=colour244]| #[default]#(whoami)@#H"
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour39]%H:%M "
setw -g window-status-current-format "#[fg=colour16,bg=colour81,bold] #I:#W "
setw -g window-status-format "#[fg=colour250] #I:#W "

setw -g window-style default
setw -g window-active-style default
setw -g pane-border-status off
setw -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{pane_title}"'
setw -g pane-border-style default
setw -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}"

set -g message-style default
setw -g mode-style noattr,bg=yellow,fg=black
set -g display-panes-colour blue
set -g display-panes-active-colour red
