# Pane visibility overlay for Rosé Pine dark.

setw -g window-style "dim,fg=#e0def4,bg=#1f1d2e"
setw -g window-active-style "fg=default,bg=default"
setw -g pane-border-style "fg=#44415a"
setw -g pane-active-border-style "fg=#f6c177,bold"
setw -g pane-border-status top
setw -g pane-border-lines single
setw -g pane-border-indicators colour
setw -g pane-border-format "#{?pane_active,#[fg=#191724,bg=#f6c177,bold]#{p240: active p#P #{pane_current_command} }#[default],}"

set -g message-style "bg=#f6c177,fg=#191724,bold"
setw -g mode-style "bg=#c4a7e7,fg=#191724,bold"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#f6c177"
