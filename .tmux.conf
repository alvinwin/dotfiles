# Sensible tmux defaults for daily terminal use.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on

# Start panes/windows at 1 to match common human counting.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep navigation and copy mode consistent with vim-style keys.
setw -g mode-keys vi
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Quick resize shortcuts.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Theme and pane visibility.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -goq @rose_pine_auto_theme on
set -goq @rose_pine_day_start 7
set -goq @rose_pine_night_start 18
set -goq @rose_pine_check_interval 300
source-file ~/.config/tmux/themes/rose-pine-dawn.conf

# Auto-switch when tmux receives terminal light/dark theme events.
set-hook -g client-dark-theme "source-file ~/.config/tmux/themes/rose-pine-dark.conf"
set-hook -g client-light-theme "source-file ~/.config/tmux/themes/rose-pine-dawn.conf"
run-shell -b "~/.config/tmux/scripts/rose-pine-auto-theme.sh --apply"
run-shell -b "~/.config/tmux/scripts/rose-pine-auto-theme.sh --watch"

# Manual fallback for clients that do not report light/dark theme changes.
bind T display-menu -T "tmux theme" \
  "Auto by time" a "set -g @rose_pine_auto_theme on \; run-shell -b '~/.config/tmux/scripts/rose-pine-auto-theme.sh --apply' \; display-message 'tmux theme auto'" \
  "Dark now" d "set -g @rose_pine_auto_theme off \; source-file ~/.config/tmux/themes/rose-pine-dark.conf \; display-message 'tmux theme dark'" \
  "Light now" l "set -g @rose_pine_auto_theme off \; source-file ~/.config/tmux/themes/rose-pine-dawn.conf \; display-message 'tmux theme light'"
bind U set -g @rose_pine_auto_theme off \; source-file ~/.config/tmux/themes/plain.conf \; display-message "tmux plain fallback loaded"

# Make copy-mode usable with the mouse and vi keys.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"

# Lightweight visibility helpers that work better on phone terminals than popups.
bind P new-window -n panes "tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index} active=#{pane_active} command=#{pane_current_command} title=#{pane_title} cwd=#{pane_current_path}' | less -S"
bind G new-window -n next "glow -p /home/akihabara/imagination/.session-next.md"

# Discoverability helper: prefix M opens a curated menu of the custom bindings
# in this file. Built-in tmux help is still prefix ?.
bind M display-menu -T "tmux help" \
  "new window: prefix c" c "new-window -c '#{pane_current_path}'" \
  "split horizontal: prefix |" s "split-window -h -c '#{pane_current_path}'" \
  "split vertical: prefix -" v "split-window -v -c '#{pane_current_path}'" \
  "pane left: prefix h or alt-h" h "select-pane -L" \
  "pane down: prefix j or alt-j" j "select-pane -D" \
  "pane up: prefix k or alt-k" k "select-pane -U" \
  "pane right: prefix l or alt-l" l "select-pane -R" \
  "resize left: prefix H" H "resize-pane -L 5" \
  "resize down: prefix J" J "resize-pane -D 5" \
  "resize up: prefix K" K "resize-pane -U 5" \
  "resize right: prefix L" L "resize-pane -R 5" \
  "copy mode: prefix [" [ "copy-mode" \
  "visual picker: prefix Space" Space "display-message 'press prefix Space for tmux-thumbs'" \
  "pane roster: prefix P" P "display-message 'press prefix P for pane roster'" \
  "session-next: prefix G" G "display-message 'press prefix G for session-next'" \
  "theme menu: prefix T" T "display-message 'press prefix T for theme menu'" \
  "reload config: prefix r" r "source-file ~/.tmux.conf" \
  "all tmux keys: prefix ?" ? "display-message 'press prefix ? for all tmux keys'"

# Reduce accidental detach behavior and improve redraws.
set -g detach-on-destroy off
set -g set-clipboard on


# >>> codex-wsl-clipboard
# WSL2 clipboard bridge: lowercase y copies exactly; uppercase Y cleans
# visually wrapped terminal text while preserving wrapped path tokens.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',screen-256color:clipboard'
set -as terminal-features ',tmux-256color:clipboard'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "perl -0pe 's/([[:alnum:]_\/.=-])\n[[:blank:]]+([[:alnum:]_\/.=-])/$1$2/g; s/([^\n])\n[[:blank:]]*([^\n])/$1 $2/g' | win32yank.exe -i --crlf"
bind Y send -X copy-pipe-and-cancel "perl -0pe 's/([[:alnum:]_\/.=-])\n[[:blank:]]+([[:alnum:]_\/.=-])/$1$2/g; s/([^\n])\n[[:blank:]]*([^\n])/$1 $2/g' | win32yank.exe -i --crlf"
# <<< codex-wsl-clipboard

# tmux-thumbs adds Flash-style labels for paths, URLs, hashes, and numbers.
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
