# Sensible tmux defaults for daily terminal use.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on

# Start panes/windows at 1 to match common human counting.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep navigation and copy mode consistent with vim-style keys.
setw -g mode-keys vi
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind N command-prompt -p "pane name:" 'select-pane -T "%%"'

# Add useful context to tmux's native session/window/pane tree.
set -goq @tree_view clean
set -g @tree_format '#{?pane_format,#[bold]PANE#[default]  #{pane_index}  #{pane_current_command}  #{?pane_title,#{pane_title},untitled}  #[dim]#{b:pane_current_path}#[default],#{?window_format,#[bold]WINDOW#[default]  #{window_name}#{window_flags}  #{window_panes} panes  #[dim]#{b:pane_current_path}#[default],#[bold]SESSION#[default]  #{session_windows} windows  #[dim]#{b:session_path}#[default]}}'
bind s if-shell -F '#{==:#{@tree_view},clean}' \
  'choose-tree -Zs -F "#{E:@tree_format}"' \
  'choose-tree -Zs'
bind w if-shell -F '#{==:#{@tree_view},clean}' \
  'choose-tree -Zw -F "#{E:@tree_format}"' \
  'choose-tree -Zw'
bind v if-shell -F '#{==:#{@tree_view},clean}' \
  'set -g @tree_view default' \
  'set -g @tree_view clean' \; \
  display-message 'tmux tree: #{@tree_view}'

# Quick resize shortcuts.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fixed Tokyo Night Moon theme with quiet, single-line chrome.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 20
set-hook -gu client-dark-theme
set-hook -gu client-light-theme
source-file ~/.config/tmux/themes/tokyo-night-moon.conf

# Keep agent state visible as text only: gold means waiting for input.
set -g @agent-indicator-background-enabled off
set -g @agent-indicator-border-enabled off
set -g @agent-indicator-animation-enabled off
set -g @agent-indicator-notification-enabled off
set -g @agent-indicator-running-window-title-bg ''
set -g @agent-indicator-running-window-title-fg ''
set -g @agent-indicator-needs-input-window-title-bg '#222436'
set -g @agent-indicator-needs-input-window-title-fg '#ffc777'
set -g @agent-indicator-done-window-title-bg ''
set -g @agent-indicator-done-window-title-fg ''
run-shell ~/.tmux/plugins/tmux-agent-indicator/agent-indicator.tmux

bind T source-file ~/.config/tmux/themes/tokyo-night-moon.conf \; display-message "tmux Tokyo Night Moon loaded"
bind U source-file ~/.config/tmux/themes/plain.conf \; display-message "tmux plain fallback loaded"

# Make copy-mode usable with the mouse and vi keys.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"

# Search panes directly or open the full tmux command palette.
unbind -q P
unbind -q C-p
bind f run-shell "~/.tmux/plugins/tmux-palette/bin/tmux-palette.sh find-pane"
bind ? run-shell "~/.tmux/plugins/tmux-palette/bin/tmux-palette.sh"
bind G new-window -n next 'glow -p "$HOME/imagination/.session-next.md"'

# Discoverability helper: prefix M opens a curated menu of the custom bindings
# in this file. The complete key list is available from the command palette.
bind M display-menu -T "tmux help" \
  "new window: prefix c" c "new-window -c '#{pane_current_path}'" \
  "split horizontal: prefix |" s "split-window -h -c '#{pane_current_path}'" \
  "split vertical: prefix -" v "split-window -v -c '#{pane_current_path}'" \
  "pane left: prefix h or alt-h" h "select-pane -L" \
  "pane down: prefix j or alt-j" j "select-pane -D" \
  "pane up: prefix k or alt-k" k "select-pane -U" \
  "pane right: prefix l or alt-l" l "select-pane -R" \
  "resize left: prefix H" H "resize-pane -L 5" \
  "resize down: prefix J" J "resize-pane -D 5" \
  "resize up: prefix K" K "resize-pane -U 5" \
  "resize right: prefix L" L "resize-pane -R 5" \
  "copy mode: prefix [" [ "copy-mode" \
  "visual picker: prefix Space" Space "display-message 'press prefix Space for tmux-thumbs'" \
  "find pane: prefix f" f "display-message 'press prefix f to find a pane'" \
  "command palette: prefix ?" ? "display-message 'press prefix ? for command palette'" \
  "name pane: prefix N" N "display-message 'press prefix N to name this pane'" \
  "session-next: prefix G" G "display-message 'press prefix G for session-next'" \
  "theme menu: prefix T" T "display-message 'press prefix T for theme menu'" \
  "tree view: prefix v" v "display-message 'press prefix v to toggle clean/default tree'" \
  "reload config: prefix r" r "source-file ~/.tmux.conf"

# Reduce accidental detach behavior and improve redraws.
set -g detach-on-destroy off
set -g set-clipboard on


# >>> codex-wsl-clipboard
# WSL2 clipboard bridge: lowercase y copies exactly; uppercase Y cleans
# visually wrapped terminal text while preserving wrapped path tokens.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',screen-256color:clipboard'
set -as terminal-features ',tmux-256color:clipboard'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "perl -0pe 's/([[:alnum:]_\/.=-])\n[[:blank:]]+([[:alnum:]_\/.=-])/$1$2/g; s/([^\n])\n[[:blank:]]*([^\n])/$1 $2/g' | win32yank.exe -i --crlf"
bind Y send -X copy-pipe-and-cancel "perl -0pe 's/([[:alnum:]_\/.=-])\n[[:blank:]]+([[:alnum:]_\/.=-])/$1$2/g; s/([^\n])\n[[:blank:]]*([^\n])/$1 $2/g' | win32yank.exe -i --crlf"
# <<< codex-wsl-clipboard

# tmux-thumbs adds Flash-style labels for paths, URLs, hashes, and numbers.
set -g @thumbs-command 'tmux set-buffer -- {} && tmux save-buffer - | win32yank.exe -i --crlf && tmux display-message "Copied {}"'
set -g @thumbs-upcase-command 'tmux set-buffer -- {} && tmux save-buffer - | win32yank.exe -i --crlf && tmux paste-buffer && tmux display-message "Copied and pasted {}"'
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
